<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Root & Leaf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#101814;--bg-card:#1C2620;--bg-raised:#233028;
      --green:#4A7C59;--green-light:#5C9970;--accent:#B7D49B;
      --text:#F5F6F2;--text-muted:rgba(245,246,242,.6);--text-dim:rgba(245,246,242,.35);
      --border:rgba(245,246,242,.08);--border-hover:rgba(245,246,242,.16);
      --r-md:14px;--r-lg:22px;--r-sm:8px;--trans:.3s ease;
    }
    html{-webkit-font-smoothing:antialiased}
    body{
      font-family:'DM Sans',sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:1.5rem;
    }
    .login-card{
      width:min(400px,100%);
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--r-lg);
      padding:2.5rem;
    }
    .login-logo{
      display:flex;align-items:center;gap:.7rem;
      justify-content:center;margin-bottom:2rem;
    }
    .login-logo span{
      font-family:'Bebas Neue',sans-serif;
      font-size:1.3rem;letter-spacing:.14em;
    }
    h1{
      font-family:'Bebas Neue',sans-serif;
      font-size:1.8rem;letter-spacing:.08em;
      text-align:center;margin-bottom:.4rem;
    }
    .login-sub{
      text-align:center;font-size:.85rem;
      color:var(--text-muted);margin-bottom:2rem;
    }
    .form-field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.25rem}
    .form-field label{font-size:.8rem;font-weight:500;color:var(--text-muted);letter-spacing:.04em}
    .form-field input{
      padding:.75rem 1rem;
      background:var(--bg-raised);border:1px solid var(--border);
      border-radius:var(--r-sm);font-size:.9rem;color:var(--text);
      outline:none;font-family:inherit;
      transition:border-color var(--trans);
    }
    .form-field input:focus{border-color:var(--green)}
    .form-field input::placeholder{color:var(--text-dim)}
    .btn{
      width:100%;padding:.8rem 1.5rem;
      background:var(--green);color:#fff;
      border:none;border-radius:var(--r-sm);
      font-family:inherit;font-size:.9rem;font-weight:500;
      cursor:pointer;
      transition:background var(--trans),transform var(--trans),box-shadow var(--trans);
      box-shadow:0 4px 20px rgba(74,124,89,.3);
    }
    .btn:hover{background:var(--green-light);transform:translateY(-1px);box-shadow:0 6px 28px rgba(74,124,89,.5)}
    .error{
      background:rgba(240,128,128,.1);border:1px solid rgba(240,128,128,.3);
      border-radius:var(--r-sm);padding:.65rem 1rem;
      font-size:.85rem;color:#f08080;margin-bottom:1.25rem;
      text-align:center;
    }
    .back-link{
      display:block;text-align:center;margin-top:1.25rem;
      font-size:.8rem;color:var(--text-dim);
      transition:color var(--trans);text-decoration:none;
    }
    .back-link:hover{color:var(--accent)}
    .hint{
      text-align:center;margin-top:1rem;
      font-size:.75rem;color:var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <svg width="20" height="28" viewBox="0 0 24 32" fill="none">
        <path d="M12 30C12 30 2 22 2 12C2 4 7 1 12 1C17 1 22 4 22 12C22 22 12 30 12 30Z" fill="#4A7C59"/>
        <path d="M12 30L12 6" stroke="#101814" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span>ROOT &amp; LEAF</span>
    </div>
    <h1>Admin Access</h1>
    <p class="login-sub">Enter your admin password to continue.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <div class="form-field">
        <label for="password">Admin Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••••" required autofocus />
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>

    <a href="/" class="back-link">← Back to store</a>
    <p class="hint">Default password: <code>rootleaf2025</code> — change via <code>ADMIN_PASSWORD</code> env var.</p>
  </div>
</body>
</html>
